<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWork AI — SafeSphere</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="../bhashini.css">
    <style>
        .chat-header {
            text-align: left;
            margin-bottom: 2rem;
            position: relative;
        }

        .chat-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-cyan), #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: var(--transition-smooth);
            padding: 0.5rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
        }

        .back-nav:hover {
            color: var(--text-white);
            background: var(--glass-bg-hover);
            transform: translateX(-5px);
        }

        .chat-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            height: 60vh;
            min-height: 500px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .chat-history {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            font-size: 1.05rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--text-white);
            align-self: flex-start;
            border-bottom-left-radius: 0;
            padding: 1.2rem 1.8rem;
        }

        .message.bot ol,
        .message.bot ul {
            margin: 1rem 0;
            padding-left: 1.8rem;
        }

        .message.bot li {
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }

        .message.bot ol li {
            list-style-position: outside;
        }

        .message.user {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--text-white);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .chat-input-area {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 1rem;
        }

        .chat-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 1rem 1.5rem;
            color: var(--text-white);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .chat-input:focus {
            border-color: var(--primary-cyan);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-btn {
            background: linear-gradient(135deg, var(--primary-cyan), #0ea5e9);
            color: #000;
            border: none;
            border-radius: 50px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .chat-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .chat-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--primary-cyan);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        #init-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-lg);
            color: var(--primary-cyan);
            font-weight: 600;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
        }

        #init-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="knowledge.js"></script>
</head>

<body>
    <div class="bg-aurora">
        <div class="aurora-orb aurora-orb--green"></div>
        <div class="aurora-orb aurora-orb--cyan"></div>
        <div class="aurora-orb aurora-orb--amber"></div>
    </div>

    <div class="app-container">

        <header class="chat-header">
            <a href="../index.html" class="back-nav">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to SafeSphere
            </a>

            <div
                style="display: flex; align-items: center; gap: 1.2rem; background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
                <div
                    style="width: 60px; height: 60px; background: linear-gradient(135deg, #10b981, #06b6d4); border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="white">
                        <path
                            d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V18A1,1 0 0,1 22,19H21V20A2,2 0 0,1 19,22H5A2,2 0 0,1 3,20V19H2A1,1 0 0,1 1,18V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z" />
                    </svg>
                </div>
                <div style="flex: 1;">
                    <h1
                        style="margin: 0; font-size: 2.4rem; font-weight: 900; background: linear-gradient(to right, #ffffff, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        SafeWork AI</h1>
                    <p
                        style="margin: 0.3rem 0 0 0; font-size: 0.85rem; color: #10b981; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">
                        Statutory Compliance Intelligence</p>
                </div>
                <button id="reset-key-btn"
                    style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; padding: 0.6rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s;">
                    LLM MODEL SETUP
                </button>
            </div>

            <p style="margin: 1.2rem 0 0 0; font-size: 1rem; color: #94a3b8; line-height: 1.6; max-width: 800px;">
                Intelligent assistant for the <strong>OSHWC Code 2020</strong> and <strong>OSH (Central) Rules</strong>.
            </p>
        </header>

        <div class="chat-container fade-up" style="position: relative;">
            <div id="init-overlay">
                <div class="loading-dots" style="margin-bottom: 1rem;">
                    <span></span><span></span><span></span>
                </div>
                <span id="init-status">Loading Statutory Data...</span>
            </div>

            <div id="api-modal" class="hidden"
                style="position: fixed; inset: 0; background: rgba(10, 15, 26, 0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
                <div
                    style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; max-width: 500px; width: 92%; padding: 2rem;">
                    <h3 style="margin: 0 0 1.5rem 0; font-size: 1.5rem; text-align: center; color: #fff;">LLM Model
                        Setup</h3>

                    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-size: 0.8rem; color: #94a3b8; font-weight: 700;">PROVIDER</label>
                            <select id="ai-provider"
                                style="width: 100%; padding: 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: white;">
                                <option value="groq">Groq Cloud (Fastest - Free Tier)</option>
                                <option value="gemini">Google Gemini 1.5 Flash</option>
                                <option value="ollama">Ollama (Local)</option>
                            </select>
                        </div>

                        <div id="api-key-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-size: 0.8rem; color: #94a3b8; font-weight: 700;">API KEY</label>
                            <input type="password" id="api-key-input" placeholder="Enter your API key..."
                                style="width: 100%; padding: 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: white;">
                        </div>

                        <button id="save-key-btn"
                            style="width: 100%; padding: 1.1rem; border-radius: 16px; border: none; background: #10b981; color: white; font-weight: 800; cursor: pointer;">Save
                            & Initialize Engine</button>
                    </div>
                </div>
            </div>

            <div class="chat-history" id="chat-history">
                <div class="message bot">Hello! I am SafeWork AI. I have loaded the OSHWC Code 2020. How can I help you?
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type your question here..." disabled>
                <button id="send-btn" class="chat-btn" disabled>
                    <svg viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let PROVIDER = localStorage.getItem('SAFEWORK_AI_PROVIDER') || 'groq';
            let API_KEY = localStorage.getItem('SAFEWORK_AI_KEY') || '';
            let knowledgeContext = [];
            let chatContext = [];
            let embedder = null;

            const chatHistory = document.getElementById('chat-history');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const apiModal = document.getElementById('api-modal');
            const apiKeyInput = document.getElementById('api-key-input');
            const saveKeyBtn = document.getElementById('save-key-btn');
            const resetKeyBtn = document.getElementById('reset-key-btn');
            const aiProvider = document.getElementById('ai-provider');
            const initOverlay = document.getElementById('init-overlay');

            async function initAI() {
                try {
                    // Show modal if no key
                    if (!API_KEY && PROVIDER !== 'ollama') {
                        apiModal.classList.remove('hidden');
                        apiModal.style.display = 'flex';
                    }

                    console.log("Loading AI Engine...");
                    const transformers = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
                    embedder = await transformers.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
                    console.log("AI Engine Ready.");

                    checkReady();
                } catch (err) {
                    console.error("AI Init Error:", err);
                }
            }

            function loadKnowledge() {
                console.log("Checking for Statutory Data...");
                const data = window.KNOWLEDGE_BASE_EMBEDDINGS || (typeof KNOWLEDGE_BASE_EMBEDDINGS !== 'undefined' ? KNOWLEDGE_BASE_EMBEDDINGS : null);

                if (data && data.length > 0) {
                    knowledgeContext = data;
                    console.log("Statutory Data Active.");
                    checkReady();
                } else {
                    setTimeout(loadKnowledge, 1000);
                }
            }

            function checkReady() {
                // If both Engine AND Data are ready, unlock the UI
                if (embedder && knowledgeContext.length > 0) {
                    initOverlay.classList.add('hidden');
                    initOverlay.style.display = 'none';

                    if (API_KEY || PROVIDER === 'ollama') {
                        chatInput.disabled = false;
                        sendBtn.disabled = false;
                        chatInput.focus();
                    }
                }
            }

            saveKeyBtn.onclick = () => {
                localStorage.setItem('SAFEWORK_AI_KEY', apiKeyInput.value.trim());
                localStorage.setItem('SAFEWORK_AI_PROVIDER', aiProvider.value);
                window.location.reload();
            };

            resetKeyBtn.onclick = () => apiModal.classList.remove('hidden');

            async function handleSend() {
                const text = chatInput.value.trim();
                if (!text) return;

                addMessage(text, 'user');
                chatInput.value = '';
                chatInput.disabled = true;
                sendBtn.disabled = true;

                const loadingId = addLoadingIndicator();

                try {
                    const queryVector = await embedder(text, { pooling: 'mean', normalize: true });
                    const scoredChunks = knowledgeContext.map(chunk => ({
                        ...chunk,
                        score: Array.from(queryVector.data).reduce((sum, val, i) => sum + val * chunk.embedding[i], 0)
                    })).sort((a, b) => b.score - a.score);

                    const searchContext = scoredChunks.slice(0, 10).map(c => c.text).join("\n\n");
                    const systemText = `You are SafeWork AI, an Indian OSH expert. Use the following context to answer compliance queries.\n\nCONTEXT:\n${searchContext}`;

                    let response;
                    let answerText = "";
                    const currentHistory = chatContext.map(m => ({ role: m.role === 'model' ? 'assistant' : 'user', content: m.parts[0].text }));
                    currentHistory.push({ role: "user", content: text });

                    if (PROVIDER === 'groq') {
                        response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "llama-3.1-8b-instant",
                                messages: [{ role: "system", content: systemText }, ...currentHistory],
                                temperature: 0.1
                            })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error?.message || "Groq Service Error");
                        if (!data.choices || !data.choices[0]) throw new Error("Invalid response format from Groq.");
                        answerText = data.choices[0].message.content;

                    } else if (PROVIDER === 'gemini') {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                        response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                "system_instruction": { "parts": [{ "text": systemText }] },
                                "contents": chatContext.length > 0 ? chatContext : [{ role: "user", parts: [{ text: text }] }]
                            })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error?.message || "Gemini Service Error");
                        if (!data.candidates || !data.candidates[0]) throw new Error("Invalid response format from Gemini.");
                        answerText = data.candidates[0].content.parts[0].text;

                    } else if (PROVIDER === 'ollama') {
                        response = await fetch(`http://localhost:11434/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: "llama3",
                                messages: [{ role: "system", content: systemText }, ...currentHistory],
                                stream: false
                            })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error("Ollama connection failed.");
                        answerText = data.message.content;
                    }

                    removeLoadingIndicator(loadingId);
                    addMessage(answerText, 'bot');
                    chatContext.push({ role: 'user', parts: [{ text }] });
                    chatContext.push({ role: 'model', parts: [{ text: answerText }] });

                } catch (error) {
                    removeLoadingIndicator(loadingId);
                    addMessage("Error: " + error.message, 'bot');
                } finally {
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                }
            }

            function addMessage(text, type) {
                const msg = document.createElement('div');
                msg.className = `message ${type}`;
                msg.innerHTML = type === 'bot' ? marked.parse(text) : text;
                chatHistory.appendChild(msg);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            function addLoadingIndicator() {
                const id = 'loading-' + Date.now();
                const msg = document.createElement('div');
                msg.id = id; msg.className = 'message bot';
                msg.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
                chatHistory.appendChild(msg);
                return id;
            }

            function removeLoadingIndicator(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            sendBtn.onclick = handleSend;
            chatInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };

            // Ignition - Run both in parallel
            initAI();
            loadKnowledge();
        });
    </script>
</body>

</html>
