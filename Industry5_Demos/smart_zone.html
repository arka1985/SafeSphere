<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Zone Geofencing | Industry 5.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../bhashini.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="instructions.css">
    <style>
        .demo-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            min-height: calc(100vh - 200px);
        }

        .map-container {
            position: relative;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid transparent;
        }

        .stat-card.alert {
            background: rgba(255, 68, 68, 0.1);
            border-color: var(--danger);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0);
            }
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .zone-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .zone-safe {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .zone-warn {
            background: var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow);
        }

        .zone-danger {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        .control-group {
            margin-top: 2rem;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 0.5rem;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--neon-cyan);
            margin-top: -6px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <!-- ═══ SafeSphere Bhashini Multilingual Widget ═══ -->
    <div class="bhashini-widget-wrapper bhashini-skip-translation">
        <div class="bhashini-widget" id="bhashini-trigger">
            <div class="bhashini-logo-text">अ<span>A</span></div>
        </div>

        <div class="bhashini-menu" id="bhashini-menu">
            <div class="bhashini-menu__header">
                <span class="bhashini-menu__title">Select Language</span>
                <span class="bhashini-menu__source">Powered by Bhashini AI</span>
            </div>
            <div class="bhashini-menu__grid">
                <button class="lang-option active" data-lang="en">English</button>
                <button class="lang-option" data-lang="hi">हिन्दी (Hindi)</button>
                <button class="lang-option" data-lang="bn">বাংলা (Bengali)</button>
                <button class="lang-option" data-lang="te">తెలుగు (Telugu)</button>
                <button class="lang-option" data-lang="mr">मराठी (Marathi)</button>
                <button class="lang-option" data-lang="ta">தமிழ் (Tamil)</button>
                <button class="lang-option" data-lang="gu">ગુજરાતી (Gujarati)</button>
                <button class="lang-option" data-lang="kn">కన్నడ (Kannada)</button>
                <button class="lang-option" data-lang="ml">മലയാളം (Malayalam)</button>
                <button class="lang-option" data-lang="pa">ਪੰਜਾਬੀ (Punjabi)</button>
            </div>
        </div>
    </div>

    <!-- Official Bhashini Bridge -->
    <div id="bhashini-plugin-utility" class="bhashini-plugin-container"></div>
    <script src="https://translation-plugin.bhashini.co.in/v3/website_translation_utility.js?v=1.3.1"
        language-icon-color="#10b981"></script>
    <script src="../main.js"></script>

    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon">📡</div>
            Smart Zone
        </a>
        <div class="nav-links">
            <a href="../virtual_lab/index.html" class="nav-link">← Lab Hub</a>
            <a href="exoskeleton.html" class="nav-link">Exoskeleton</a>
            <a href="smart_zone.html" class="nav-link active">Geofencing</a>
        </div>
    </nav>

    <main class="container">
        <div class="demo-layout">
            <!-- Map View -->
            <div class="map-container">
                <div class="map-grid"></div>
                <canvas id="zoneCanvas"></canvas>
            </div>

            <!-- Sidebar -->
            <div class="glass-panel">
                <h3>System Status</h3>

                <div class="stat-card" id="statusCard">
                    <div class="stat-label">Safety Zone Status</div>
                    <div class="stat-value" id="zoneStatus">
                        <span class="zone-indicator zone-safe"></span>SAFE
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Pedestrians Nearby</div>
                    <div class="stat-value" id="pedCount">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Forklift Speed</div>
                    <div class="stat-value"><span id="speedVal">0</span> km/h</div>
                </div>

                <div class="stat-card" id="brakeCard"
                    style="display: none; border-color: var(--danger); color: var(--danger);">
                    <div class="stat-label" style="color: var(--danger);">ACTION</div>
                    <div class="stat-value">⚠️ AUTO-BRAKE</div>
                </div>

                <div class="control-group">
                    <label>Simulated Traffic Density</label>
                    <input type="range" min="1" max="10" value="3" id="densityControl"
                        oninput="updateDensity(this.value)">
                </div>

                <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                    <p>Dynamic geofencing adjusts safety zones based on speed and obstacles.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="instructions.js"></script>
    <script src="smart_zone.js"></script>
</body>

</html>
