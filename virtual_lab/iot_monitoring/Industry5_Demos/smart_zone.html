<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Zone Geofencing | Industry 5.0</title>
    <link rel="stylesheet" href="../../../../main.css">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="instructions.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- ═══ Animated Background ═══ -->
    <div class="bg-aurora">
        <div class="aurora-orb aurora-orb--green"></div>
        <div class="aurora-orb aurora-orb--cyan"></div>
        <div class="aurora-orb aurora-orb--amber"></div>
    </div>
    <canvas id="particles-canvas"></canvas>

    <div class="lab-hub-container">
        <header class="lab-header fade-up">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Industry 5.0 Hub
            </a>
            <h1 class="lab-title">Smart Zone <span class="accent">Geofencing</span></h1>
            <p class="lab-subtitle">Industrial IoT Proximity Monitoring & Autonomous Safety</p>
        </header>

    <main class="container">
        <div class="demo-layout">
            <!-- Map View -->
            <div class="map-container">
                <div class="map-grid"></div>
                <canvas id="zoneCanvas"></canvas>
            </div>

            <!-- Sidebar -->
            <div class="glass-panel">
                <h3>System Status</h3>

                <div class="stat-card" id="statusCard">
                    <div class="stat-label">Safety Zone Status</div>
                    <div class="stat-value" id="zoneStatus">
                        <span class="zone-indicator zone-safe"></span>SAFE
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Pedestrians Nearby</div>
                    <div class="stat-value" id="pedCount">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Forklift Speed</div>
                    <div class="stat-value"><span id="speedVal">0</span> km/h</div>
                </div>

                <div class="stat-card" id="brakeCard"
                    style="display: none; border-color: var(--danger); color: var(--danger);">
                    <div class="stat-label" style="color: var(--danger);">ACTION</div>
                    <div class="stat-value">⚠️ AUTO-BRAKE</div>
                </div>

                <div class="control-group">
                    <label>Simulated Traffic Density</label>
                    <input type="range" min="1" max="10" value="3" id="densityControl"
                        oninput="updateDensity(this.value)">
                </div>

                <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                    <p>Dynamic geofencing adjusts safety zones based on speed and obstacles.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="instructions.js"></script>
    <script src="smart_zone.js"></script>
</body>

</html>
