<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rula-reba</title>
    <link rel="stylesheet" href="../../bhashini.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- ═══ SafeSphere Bhashini Multilingual Widget ═══ -->
    <div class="bhashini-widget-wrapper bhashini-skip-translation">
        <div class="bhashini-widget" id="bhashini-trigger">
            <div class="bhashini-logo-text">अ<span>A</span></div>
        </div>

        <div class="bhashini-menu" id="bhashini-menu">
            <div class="bhashini-menu__header">
                <span class="bhashini-menu__title">Select Language</span>
                <span class="bhashini-menu__source">Powered by Bhashini AI</span>
            </div>
            <div class="bhashini-menu__grid">
                <button class="lang-option active" data-lang="en">English</button>
                <button class="lang-option" data-lang="hi">हिन्दी (Hindi)</button>
                <button class="lang-option" data-lang="bn">বাংলা (Bengali)</button>
                <button class="lang-option" data-lang="te">తెలుగు (Telugu)</button>
                <button class="lang-option" data-lang="mr">मराठी (Marathi)</button>
                <button class="lang-option" data-lang="ta">தமிழ் (Tamil)</button>
                <button class="lang-option" data-lang="gu">ગુજરાતી (Gujarati)</button>
                <button class="lang-option" data-lang="kn">కన్నడ (Kannada)</button>
                <button class="lang-option" data-lang="ml">മലയാളം (Malayalam)</button>
                <button class="lang-option" data-lang="pa">ਪੰਜਾਬੀ (Punjabi)</button>
            </div>
        </div>
    </div>

    <!-- Official Bhashini Bridge -->
    <div id="bhashini-plugin-utility" class="bhashini-plugin-container"></div>
    <script src="https://translation-plugin.bhashini.co.in/v3/website_translation_utility.js?v=1.3.1"
        language-icon-color="#10b981"></script>
    <script src="../../main.js"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
